name: Deploy to A2

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-svbb
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm install

      # 4. Build project
      - name: Build project
        run: npm run build

      # 5. Cleanup unnecessary files (reduce upload size)
      - name: Cleanup build
        run: |
          find dist -name "*.map" -type f -delete

      # 6. Deploy via SFTP (stable version)
      - name: Deploy to A2 via SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}

          protocol: sftp
          port: 22

          local-dir: dist/
          server-dir: /public_html/

          # safer deploy (avoid timeout & partial delete issues)
          dangerous-clean-slate: false

          # stability improvements
          timeout: 600000
          retry: 3
          log-level: verbose

          # ignore unnecessary files
          exclude: |
            **/.git*
            **/.github*
            **/node_modules/**
