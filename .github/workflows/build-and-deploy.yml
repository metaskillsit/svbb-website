- name: Deploy to A2 via FTPS
  uses: SamKirkland/FTP-Deploy-Action@v4.3.5
  with:
    server: ${{ secrets.FTP_SERVER }}
    username: ${{ secrets.FTP_USERNAME }}
    password: ${{ secrets.FTP_PASSWORD }}

    protocol: ftps
    port: 21
    secure: true

    local-dir: dist/
    server-dir: /public_html/

    dangerous-clean-slate: false

    timeout: 1200000
    retries: 5
    passive: true
    concurrency: 1

    log-level: verbose
